# Hub configuration sample used for smoke-testing config parsing.
# TODO: organize actual coverage of all supported features.
# TODO: maybe auto-checking of doc samples would be also appropriate
{
    launcherConfig: {
        # Global Launcher configuration
        configCheckPeriod = 10s  // How often check modification time of main configuration file. 10s by default.
        configReadPeriod = 1h    // How often read and apply configuration. 1h by default.
    }

    endpointProperties: {
        # Global MARS configuration
        mars.root = "hub-retail"   // Root name of global MARS tree. null (aka empty string) by default.
        mars.address = ":9000"     // Connection address of global MARS. null (aka empty string) by default.
        # TODO -Dmars.delay=10 (in seconds) is still applicable for main MARS refresh period. Consider moving it here somehow.

        # Global JMX configuration
        jmx.html.port = 8000       // Defines TCP/IP port for JMX HTML management console. null by default.
        #        jmx.html.bind = null      // Defines IP bind address for JMX HTML management console. null by default.
        #        jmx.html.ssl = null       // Turns on SSL for JMX HTML management console if not null. null by default.
        #        jmx.html.auth = null      // Turns on authorization for JMX HTML management console. null by default.
        #        jmx.rmi.port = null       // Defines TCP/IP port for JMX RMI management. null by default.

        # Global Monitoring configuration
        monitoring.stat = 10s      // Defines time interval for reporting of various monitoring parameters. null by default.
    }

    # List of modules with type, name and configuration
    modules: [{
        # Common module configuration
        type = Hub
        name = retail

        # Hub-specific configuration
        defaultUplinkBindAddr = "*"
        defaultDownlinkBindAddr = "*"

        universeConfig: {
            # Import global universe configuration from separate file.
            # Currently supposing that master config contains just universeConfig body.
            # May be re-considered to include it on upper level - then should include universeConfig prefix.
            include required("universe.conf")

            # add more spaces or redefine existing ones
            spaces: {
                delayed: {}
            }

            # add more products or redefine existing ones
            products: {
                delayed-ap1s: [{base = delayed, aggregationPeriod = 1s}]
                delayed-ap1s-awc: [{base = delayed-ap1s, allowWildcards=true}]
                filtered: [{base = realtime, filter = bs}, {base = delayed, filter = opt}, {base = archive, filter = spread}]
            }

            # redefine local override
            storeEverythingSpaces: ["*"]
        }

        # Hub uplinks (aka distributors)
        uplinks: {
            sample: {              // Space-based uplink. Provides direct connection to selected space.
                name = sample      // Uplink name. Always set to ID in "uplinks". Logs error if mismatched.
                address = ":7777"  // Uplink address. Required field. Reports WARNING if has mismatched name or filter.
                filter = "*"       // Uplink filter. Anything by default.
                spaces: [sample]   // Selected spaces. Currently must select exactly 1 space. Empty by default.
                // stripe = ... (or may be inherited from space ???)
            }
            archive-reader: {
                address = "file:tape.txt[format=text,cycle=true,readAs=raw_data]"
                spaces: [archive]
            }
            realtime-reader: {
                address = "file:tape.txt[format=text,cycle=true,readAs=raw_data,fieldReplacer=time:*:current]"
                spaces: [realtime]
            }
            delayed-reader: {
                address = "file:tape.txt[format=text,cycle=true,readAs=raw_data,fieldReplacer=time:*:40271s]"
                spaces: [delayed]
            }
            #TODO: multi-space uplink
            #multi: {
            #    address = "<host>:7776"
            #    filter = "*"
            #    spaceAware = true
            #    spaces = [<space-list>] // (match required spaces) One physical connection per space
            #}
        }

        # Hub downlinks (aka agents)
        downlinks: {
            # "Space-by-port" example
            sample-sp: {           // Space-based downlink. Provides direct connection to selected space.
                name = sample-sp   // Downlink name. Always set to ID in "downlinks". Logs error if mismatched.
                address = ":7778"  // Downlink address. Required field. Reports WARNING if has mismatched name or filter.
                filter = "*"       // Downlink filter. Anything by default.
                spaces: [sample]   // Selected spaces. Currently must select exactly 1 space. Empty by default.
                products: []       // Selected products. Must be empty for space-based downlink. Empty by default.
            }
            sample-pr: {           // Product-based downlink. Provides access to all products and spaces as specified.
                name = sample-pr   // Downlink name. Always set to ID in "downlinks". Logs error if mismatched.
                address = ":7779"  // Downlink address. Required field. Reports WARNING if has mismatched name or filter.
                filter = "*"       // Downlink filter. Anything by default.
                spaces: []         // Selected spaces. Must be empty for product-based downlink. Empty by default.
                products: [sample] // Selected products. Must contain at least 1 channel. Empty by default.
            }
            #TODO: multi-space downlink
            #dl-multi: {
            #    name = dl-multi
            #    address = ":7017"
            #    spaceAware = true
            #    spaces: ["*"] // (match allowed spaces) One physical connection per space per client
            #}
            dl-7001: {
                address = ":7001"
                spaces: [archive]
            }
            dl-7002: {
                address = ":7002"
                spaces: [realtime]
            }
            dl-7003: {
                address = ":7003"
                filter = "AAPL,IBM"
                spaces: [delayed]
            }
            # "User-by-port" indirect entitlement example (no Auther/Token-based functionality yet)
            dl-7015: {
                address = ":7015"
                filter = "ipf[my.ipf]"
                products: [
                    {base=filtered, filter=":Quote", allowWildcards=true}
                    {base=realtime-ap1s, filter=":Trade"}
                    {base=delayed-ap1s, allowWildcards=true}
                ]
            }
            dl-7016: {
                address = ":7016"
                products: [{base=realtime, filter="ipf[my.ipf,update=2s]", aggregationPeriod="0.4s"}, archive-ap1s]
            }
        }
    }]
}
